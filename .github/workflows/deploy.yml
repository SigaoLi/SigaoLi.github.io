# Build & deploy to GitHub Pages (PRD §13).
# - push to v2     → build only (verification, no deploy)
# - push to master → build + deploy to Pages
#
# 发布路径上只剩构建与部署（2026-09-13 起）。两张安全网搬到了旁边，
# 各自发邮件、都不挡路：依赖漏洞 → audit.yml（每周），浏览器验收 → verify.yml
# （每次 push）。理由见那两个文件的抬头与 PRD §21。
name: Deploy

on:
  push:
    branches: [master, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Astro image pipeline
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-
      # v6 起内置 Astro 缓存(滚动 key,每次提交存一份)——.astro 有 194MB,会压 10GB 配额,
      # 故关掉内置的、沿用上面按 assets hash 的自管缓存(两套同路径会互相覆盖,只能二选一)。
      # 必须 v6+:v5 内部的 upload-pages-artifact 会剥掉 dotfiles,dist/.well-known/mcp.json 会丢;
      # v6 硬编码 include-hidden-files: true。
      - uses: withastro/action@v6
        with:
          node-version: 22
          cache: "false"

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
