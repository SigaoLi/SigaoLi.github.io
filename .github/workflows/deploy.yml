# Build & deploy to GitHub Pages (PRD §13).
# - push to v2     → build only (verification, no deploy)
# - push to master → build + deploy to Pages
#
# 发布路径上只剩构建与部署（2026-09-13 起）。两张安全网搬到了旁边，
# 各自发邮件、都不挡路：依赖漏洞 → audit.yml（每周），浏览器验收 → verify.yml
# （每次 push）。理由见那两个文件的抬头与 PRD §21。
name: Deploy

on:
  push:
    branches: [master, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Astro image pipeline
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-
      # v6 起内置 Astro 缓存(滚动 key,每次提交存一份)——.astro 有 194MB,会压 10GB 配额,
      # 故关掉内置的、沿用上面按 assets hash 的自管缓存(两套同路径会互相覆盖,只能二选一)。
      # 必须 v6+:v5 内部的 upload-pages-artifact 会剥掉 dotfiles,dist/.well-known/mcp.json 会丢;
      # v6 硬编码 include-hidden-files: true。
      - uses: withastro/action@v6
        with:
          node-version: 22
          cache: "false"

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 香港服务器部署（PRD §27）。与上面的 Pages 部署并行、互不依赖：
  # 这一步失败不影响 Pages，Pages 保留为备用线路。
  # 复用 build 产出的 github-pages 制品（里面是 artifact.tar），不重复构建。
  deploy-hk:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact

      - name: Unpack site
        run: |
          mkdir dist
          tar -xf pages-artifact/artifact.tar -C dist
          test -f dist/index.html

      - name: Install SSH key
        env:
          HK_DEPLOY_KEY: ${{ secrets.HK_DEPLOY_KEY }}
          HK_HOST: ${{ secrets.HK_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HK_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 不用 StrictHostKeyChecking=no：先取主机指纹，与写死的服务器指纹比对，
          # 对不上就中止（防中间人）。服务器重装系统后指纹会变，需同步改这里。
          ssh-keyscan -t ed25519 "$HK_HOST" > ~/.ssh/known_hosts
          fp=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          if [ "$fp" != "SHA256:pJJeMfwPXgkfKwGDk6BEnSZRkfWpr9q2yd1Hu8I35G8" ]; then
            echo "::error::服务器主机指纹不符：$fp"
            exit 1
          fi

      - name: Rsync to Hong Kong server
        env:
          HK_HOST: ${{ secrets.HK_HOST }}
        run: |
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "deploy@${HK_HOST}:/var/www/sigaoli/"
