# 浏览器验收 —— 每次 push 跑，失败只发邮件，不阻断部署。
#
# 为什么需要它（2026-09-13，PRD §24.5）：
# 构建成功 ≠ 页面能用。历史上真中过的那几类 bug——View Transitions 切页后
# .reveal 元素卡在 opacity:0、灯箱点不开、切语言跳错路由——`astro build`
# 全都不报错，只有真浏览器点一遍才看得出来。此前这些脚本只靠人手动跑。
#
# 为什么不做成闸门：
# 这 10 个脚本里有 ~70 处固定 waitForTimeout，在本机够用、在 CI 的慢机器上
# 可能不够，表现为「没坏却红了」。而一个经常误报的红灯会训练人无视红灯，
# 那比没有灯更糟。所以与 audit 同理——出事要知道，但不该挡住发布。
# 观察一段时间，若确实稳定，再考虑是否升级成闸门。
#
# 覆盖范围：check-links + 8 个浏览器脚本，全部在**生产构建**（astro preview）上
# 实测稳定通过。覆盖照片页与灯箱、View Transitions 导航、i18n 路由与语言偏好、
# 首页、作品页、CV 时间轴、404 双语主副对调、聊天面板深链 chip 与打字动作路由。
#
# 其余 6 个故意不收，各有原因（2026-09-13 逐个实测）：
#   verify-chat / verify-pin / verify-zoe  需要 worker 起在 8787
#   verify-facts                           真实调付费模型，受 5 次/分钟限流
#   verify-zoe-blank                       只在 astro dev 下通过；打生产构建会失败
# 强收它们只会得到一盏恒红的灯，而恒红的灯等于没有灯。
#
# verify-typeroute / verify-guide 一度也在排除之列，2026-09-14 查清后收编：
# 两者都不是站点问题——guide 卡在 5s 超时而 chip 实际 5.9-6.9s 才可见（已放宽到 12s），
# 两者又都把 Turnstile 的反自动化指纹采集残留算成了页面报错（已按来源域名过滤）。
name: Verify

on:
  push:
    branches: [master, v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 兜底闸。GitHub 默认放任 job 跑 6 小时——真卡住的话既白烧额度，
    # 又要等半天才看得到红灯。整套本地约 5 分钟，20 分钟绰绰有余。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 只装 chromium。脚本全部用 chromium，装齐三家浏览器会白等两分钟。
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # 纯 node、不需要浏览器，先跑——断链能在启预览前就报出来。
      - name: Internal links
        run: node scripts/check-links.mjs

      # 轮询而不是固定 sleep：CI 机器起得慢时 sleep 会不够，起得快时又白等。
      # 用 curl 轮询也避免了为此新增一个 wait-on 依赖。
      - name: Start preview
        run: |
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4321/ > /dev/null && echo "预览就绪（${i}s）" && exit 0
            sleep 1
          done
          echo "::error::预览服务器 60 秒未就绪"
          cat /tmp/preview.log
          exit 1

      # 逐个跑而不是 && 串联：串联会在第一个失败处停下，看不到后面几个的结果。
      # 这里让它们全跑完，最后统一判定——一次 push 就能看全所有问题。
      # 每个脚本单独限时 4 分钟。本地实测最重的 verify-guide 单跑 53-61 秒，
      # CI 机器慢些也远够；但它会**间歇性卡住**（本地在连跑长序列时复现过两次，
      # 单跑六次又全过）。没有超时的话，一个卡住的脚本会挂到整个 job 被杀，
      # 日志里只剩一片空白——正是最难查的那种失败。
      # 超时按失败记，并单独标出来，免得和真正的断言失败混为一谈。
      - name: Browser checks
        run: |
          failed=""
          for s in verify-lens verify-nav verify-i18n verify-home verify-work \
                   verify-phase4 verify-typeroute verify-guide; do
            echo "::group::$s"
            start=$(date +%s)
            if timeout 240 node "scripts/$s.mjs"; then
              echo "✓ $s（$(($(date +%s)-start))s）"
            else
              code=$?
              if [ "$code" = "124" ]; then
                echo "✗ $s 超时（240s 未结束）"
                failed="$failed $s(超时)"
              else
                echo "✗ $s（退出码 $code）"
                failed="$failed $s"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::验收未通过:$failed"
            # 预览服务器的日志——本地跑不出的失败，线索常在这里（端口占用、
            # 资源 404、SSR 报错）。CI 里看不到浏览器，能捞的现场就这么多。
            echo "::group::预览服务器日志"
            cat /tmp/preview.log || echo "(无日志)"
            echo "::endgroup::"
            exit 1
          fi
          echo "全部通过"

      # 失败时把截图捞出来——CI 里看不到浏览器，截图是唯一的现场。
      - name: Upload screenshots on failure
        if: failure()
        # v5+：v4 仍是 Node 20 运行时，GitHub 2025-09 起弃用并强制跑在 Node 24 上。
        # 仓库其余 action 早已升代（checkout@v7 / setup-node@v6 / cache@v6），这条是漏的。
        uses: actions/upload-artifact@v5
        with:
          name: verify-screenshots
          path: shots/
          retention-days: 7
          if-no-files-found: ignore
